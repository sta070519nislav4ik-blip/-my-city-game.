<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Мой город — версия 2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#b8e3f6;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;overflow:hidden;touch-action:none;color:#203347}canvas{display:block;width:100vw;height:100dvh;touch-action:none}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:7px;pointer-events:none}.pill{background:#fffef4ee;border:2px solid #fff;border-radius:18px;padding:9px 12px;font-weight:800;box-shadow:0 4px 12px #315a7430;font-size:14px}.top .pill{pointer-events:auto}.title{font-size:16px;margin-right:auto}.tools{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:10px;right:10px;display:flex;gap:7px;justify-content:center}.tool{background:#fff;border:2px solid #e3edf0;border-radius:17px;padding:10px 5px;min-width:0;flex:1;font-size:12px;font-weight:750;box-shadow:0 4px 12px #385c7640;color:#2c4d61}.tool b{display:block;font-size:25px;margin-bottom:2px}.tool.selected{background:#ffeaa1;border-color:#e9aa3c}.help{position:absolute;top:75px;left:12px;right:12px;text-align:center;pointer-events:none}.help span{display:inline-block;background:#173b51cc;color:white;border-radius:18px;padding:8px 13px;font-size:12px}.actions{position:absolute;right:12px;top:130px;display:grid;gap:8px}.round{width:43px;height:43px;border:0;border-radius:14px;background:#fffdf2e8;font-size:23px;box-shadow:0 3px 10px #3d627d40}.toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);background:#173b51eb;color:white;padding:11px 16px;border-radius:16px;font-weight:700;text-align:center;min-width:180px;opacity:0;transition:opacity .25s;pointer-events:none}.toast.show{opacity:1}.economy{position:absolute;top:76px;left:12px;display:flex;gap:7px;align-items:center}.economy .pill{font-size:12px;padding:8px}.collect{border:0;border-radius:14px;background:#ffda73;color:#583b08;font-weight:800;padding:10px;box-shadow:0 3px 8px #385c7640}.footer{position:absolute;bottom:105px;left:12px;background:#ffffffc9;border-radius:12px;padding:7px 10px;font-size:11px;max-width:215px}
</style></head><body><canvas id="game"></canvas>
<div class="top"><div class="pill title">🌆 Мой город</div><div class="pill">🪙 <span id="money">2500</span></div><div class="pill">👥 <span id="pop">0</span></div></div>
<div class="economy"><div class="pill">🧱 <span id="materials">0</span></div><div class="pill">⭐ Ур. <span id="level">1</span></div><button class="collect" id="tax">💰 Налоги</button></div><div class="help" style="top:125px"><span id="hint">Выбери постройку и нажми на клетку</span></div>
<div class="actions" style="top:173px"><button class="round" id="zin">＋</button><button class="round" id="zout">－</button><button class="round" id="rot">↻</button><button class="round" id="reset">⚙️</button></div>
<div class="toast" id="toast"></div><div class="footer">Нажми на завод, чтобы забрать материалы · собирай налоги · город сохраняется</div>
<div class="tools">
<button class="tool selected" data-tool="road"><b>🛣️</b>Дорога<br>🪙 20</button>
<button class="tool" data-tool="house"><b>🏠</b>Дом<br>🪙 120</button>
<button class="tool" data-tool="factory"><b>🏭</b>Завод<br>🪙 300</button>
<button class="tool" data-tool="park"><b>🌳</b>Парк<br>🪙 80</button>
<button class="tool" data-tool="upgrade"><b>⬆️</b>Улучшить<br>🪙 180</button>
</div>
<script>
(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d');let W,H,dpr;
const N=14, TW=58,TH=30;let zoom=1,rot=0,offX=0,offY=0,selected='road',drag=false,last=null,start=null,moved=false,pinch=null;
const prices={road:20,house:120,factory:300,park:80,upgrade:180};
let state;try{state=JSON.parse(localStorage.getItem('mycity-save-v1'))}catch(e){}
if(!state||!Array.isArray(state.cells)||state.cells.length!==N*N){state={coins:2500,cells:Array(N*N).fill(null)};for(let x=5;x<=8;x++)state.cells[7*N+x]={type:'road'};state.cells[6*N+6]={type:'house',level:1};state.cells[6*N+7]={type:'house',level:1};}
if(typeof state.materials!=='number')state.materials=0;
if(typeof state.lastTax!=='number')state.lastTax=0;
function save(){try{localStorage.setItem('mycity-save-v1',JSON.stringify(state))}catch(e){}}
function population(){return state.cells.reduce((n,c)=>n+(c?.type==='house'?c.level*12:0),0)}
function stats(){document.getElementById('money').textContent=state.coins;document.getElementById('pop').textContent=population();document.getElementById('materials').textContent=state.materials;document.getElementById('level').textContent=1+Math.floor(population()/60);let t=document.getElementById('tax'),remain=Math.max(0,30000-(Date.now()-state.lastTax));t.textContent=remain?'💰 '+Math.ceil(remain/1000)+'с':'💰 Налоги'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1900)}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!offX){offX=W/2;offY=H*.27}}
function proj(x,y,z=0){let a=x-N/2,b=y-N/2;for(let i=0;i<rot;i++){let q=a;a=-b;b=q}return {x:offX+(a-b)*TW*.5*zoom,y:offY+(a+b)*TH*.5*zoom-z*zoom}}
function poly(pts,fill,stroke){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1*zoom;ctx.stroke()}}
function diamond(x,y,c,edge){poly([proj(x,y),proj(x+1,y),proj(x+1,y+1),proj(x,y+1)],c,edge)}
function box(x,y,w,h,height,top,side1,side2){let a=proj(x,y,height),b=proj(x+w,y,height),c=proj(x+w,y+h,height),d=proj(x,y+h,height),a0=proj(x,y),b0=proj(x+w,y),c0=proj(x+w,y+h),d0=proj(x,y+h);poly([d,c,c0,d0],side1);poly([b,c,c0,b0],side2);poly([a,b,c,d],top,'#ffffff55')}
function tree(x,y,size=1){let p=proj(x,y,8*size);ctx.fillStyle='#7b5734';ctx.fillRect(p.x-2*zoom,p.y,4*zoom,14*zoom);ctx.beginPath();ctx.ellipse(p.x,p.y-6*zoom,11*size*zoom,12*size*zoom,0,0,Math.PI*2);ctx.fillStyle='#238c52';ctx.fill();ctx.beginPath();ctx.ellipse(p.x-4*zoom,p.y-11*zoom,5*zoom,5*zoom,0,0,Math.PI*2);ctx.fillStyle='#5ac978';ctx.fill()}
function render(){
ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#a2d9f6');bg.addColorStop(1,'#d4eef6');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
let order=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let p=proj(x+.5,y+.5);order.push({x,y,py:p.y})}order.sort((a,b)=>a.py-b.py);
for(const {x,y} of order){let cell=state.cells[y*N+x],v=(x*37+y*71)%11;diamond(x,y,v<3?'#8dce78':v<7?'#9bd884':'#a6de8b','#75b76e');
if(!cell){if((x*19+y*23)%13===0)tree(x+.55,y+.5,.5);continue}
if(cell.type==='road'){diamond(x+.05,y+.05,'#747c87');let a=proj(x+.28,y+.5),b=proj(x+.72,y+.5);ctx.strokeStyle='#f8df9a';ctx.lineWidth=2*zoom;ctx.setLineDash([4*zoom,4*zoom]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])}
if(cell.type==='house'){let lv=cell.level||1;box(x+.16,y+.17,.7,.67,16+lv*12,['#f8b46e','#f7d4a5','#bed9f5','#e8bdde'][lv%4], '#b87561','#d68c70');let p=proj(x+.5,y+.18,10+lv*12);ctx.fillStyle='#fff6bc';ctx.fillRect(p.x-4*zoom,p.y+3*zoom,8*zoom,6*zoom)}
if(cell.type==='factory'){if(Date.now()-(cell.lastProduction||0)>=10000){let q=proj(x+.5,y+.5,64);ctx.font=(17*zoom)+'px sans-serif';ctx.fillText('🧱',q.x-8*zoom,q.y)}box(x+.1,y+.1,.8,.8,26,'#9daeb6','#6f8490','#8396a1');box(x+.24,y+.24,.22,.22,44,'#d07c61','#aa5d4a','#b86b51')}
if(cell.type==='park'){diamond(x+.1,y+.1,'#5ec27c');tree(x+.35,y+.35,.8);tree(x+.72,y+.64,.65)}
}
requestAnimationFrame(render)}
function inverse(px,py){let u=(px-offX)/zoom/(TW*.5),v=(py-offY)/zoom/(TH*.5);let a=(u+v)/2,b=(v-u)/2;for(let i=0;i<(4-rot)%4;i++){let q=a;a=-b;b=q}return {x:Math.floor(a+N/2),y:Math.floor(b+N/2)}}
function hasRoad(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{let a=x+dx,b=y+dy;return a>=0&&b>=0&&a<N&&b<N&&state.cells[b*N+a]?.type==='road'})}
function place(px,py){
let {x,y}=inverse(px,py);if(x<0||y<0||x>=N||y>=N)return;
let idx=y*N+x,c=state.cells[idx];
if(selected==='upgrade'){
 if(c?.type!=='house')return toast('Выбери жилой дом');
 if(c.level>=5)return toast('Максимальный уровень');
 if(state.coins<prices.upgrade)return toast('Нужно 180 монет');
 if(state.materials<c.level*2)return toast('Нужно '+(c.level*2)+' материалов 🧱');
 state.coins-=prices.upgrade;state.materials-=c.level*2;c.level++;toast('🏙️ Дом улучшен!');
}else if(c?.type==='factory'){
 let elapsed=Date.now()-(c.lastProduction||0);
 if(elapsed<10000)return toast('Материалы будут через '+Math.ceil((10000-elapsed)/1000)+' сек.');
 c.lastProduction=Date.now();state.materials+=3;toast('🧱 +3 материала!');
}else{
 if(c)return toast('Эта клетка занята');
 if(state.coins<prices[selected])return toast('Недостаточно монет');
 if(selected==='house'&&!hasRoad(x,y))return toast('Дом должен стоять рядом с дорогой');
 state.coins-=prices[selected];
 state.cells[idx]={type:selected,...(selected==='house'?{level:1}:{})};
 toast('Построено!');
}
stats();save()
}
document.getElementById('tax').onclick=()=>{
 if(Date.now()-state.lastTax<30000)return toast('Налоги ещё собираются');
 let amount=Math.max(30,Math.floor(population()*1.5));
 state.coins+=amount;state.lastTax=Date.now();stats();save();toast('💰 Налоги: +'+amount+' монет');
};
setInterval(stats,1000);

cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY};last={x:e.clientX,y:e.clientY};moved=false;drag=true});
cv.addEventListener('pointermove',e=>{if(!drag||!last)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>9)moved=true;if(moved){offX+=dx;offY+=dy}last={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{if(!moved&&start)place(e.clientX,e.clientY);drag=false;last=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.3,zoom*(e.deltaY>0?.92:1.08)))},{passive:false});
cv.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);moved=true}},{passive:false});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom=Math.max(.55,Math.min(2.3,zoom*d/pinch));pinch=d;moved=true}},{passive:false});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{selected=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(t=>t.classList.toggle('selected',t===b));document.getElementById('hint').textContent=selected==='upgrade'?'Нажми на дом, чтобы улучшить':'Нажми на свободную клетку для строительства'});
document.getElementById('zin').onclick=()=>zoom=Math.min(2.3,zoom*1.2);document.getElementById('zout').onclick=()=>zoom=Math.max(.55,zoom/1.2);document.getElementById('rot').onclick=()=>rot=(rot+1)%4;
document.getElementById('reset').onclick=()=>{if(confirm('Начать новый город? Текущий прогресс будет удалён.')){localStorage.removeItem('mycity-save-v1');location.reload()}};
window.addEventListener('resize',resize);resize();stats();save();render();
})();
</script></body></html>
